<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Touch Grass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header><div class="brand"><img src="assets/touch-grass-logo.svg" alt="Touch Grass"><strong>touch <i>grass</i></strong></div><div class="status"><b></b> <span id="status-text">загрузка</span></div></header>
      <section class="hero"><p class="eyebrow">ТВОЙ ФОКУС</p><h1 id="headline">Меньше шума.<br><em>Больше тебя.</em></h1><p id="subline">Включи ручную сессию на 25 минут.</p></section>
      <button class="focus-button" id="focus-button"><span id="focus-label">Включить фокус</span><b>↗</b></button>
      <section class="stats"><div><strong id="site-count">—</strong><span>сайта под защитой</span></div><div><strong id="schedule-count">—</strong><span>активных окна</span></div></section>
      <section class="next"><div><p class="eyebrow">СЛЕДУЮЩЕЕ ОКНО</p><strong id="next-title">Проверяем расписание…</strong><span id="next-time">Автоматическая блокировка включена</span></div><span class="next-icon">◷</span></section>
      <footer><button id="protection-toggle">Отключить защиту</button><button id="dashboard">Открыть настройки ↗</button><span>Touch Grass 0.1</span></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
